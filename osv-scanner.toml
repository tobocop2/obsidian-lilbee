# osv-scanner suppressions. Keep this list short and each entry justified.
# OSV scans against the OSV.dev database, which covers more ecosystems than
# `npm audit` (GHSA, OSV, and others). When a finding maps to something
# already triaged in .github/workflows/security-scan.yml, mirror the
# suppression here so osv-scanner and npm audit stay in sync.
#
# Format:
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   reason = "..."

# The transitive vite/esbuild dev-server CVEs that vitest 2.x pinned are
# resolved by the vitest 4 upgrade (vite 8, esbuild 0.28).

[[IgnoredVulns]]
id = "CVE-2026-112366"
aliases = ["GHSA-fc5q-39xc-vjpf"]
ignoreUntil = 2026-12-18T00:00:00Z
reason = "picomatch ReDoS: dev-only via vite/vitest/tinyglobby/fdir, globs come from the repo's own config, not in main.js, no fixed release yet. Remove when picomatch ships a fix."
